
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Mo El-Haj</title>

  <script>
    // Old AbjadNLP pages redirect to the new website
    const oldPages = [
      "abjad.html",
      "abjad2025.html",
      "abjad2026.html",
      "abjad2027.html",
      "abjad2027-github.html",
      "abjad2027-roles.html",
      "author-policy.html",
      "pc-policy.html"
    ];

    const path = window.location.pathname;
    const page = path.substring(1);

    const isAbjadPage = oldPages.includes(page);

    if (isAbjadPage) {
      window.location.replace(
        "https://abjadnlp.com/" + page +
        window.location.search +
        window.location.hash
      );
    }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 80px 20px;
    }

    h1 {
      font-size: 72px;
      color: #34495e;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 26px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #34495e;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .button:hover {
      background: #2c3e50;
    }
  </style>
</head>

<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>

  <p>
    Sorry, the page you are looking for
    does not exist or may have been moved.
  </p>

  <p>
    Redirecting to the homepage in
    <strong><span id="countdown">5</span> seconds</strong>.
  </p>

  <a class="button" href="https://elhaj.uk/">
    Return to Homepage
  </a>

  <script>
    // All other missing pages return to elhaj.uk
    if (!isAbjadPage) {
      let seconds = 5;

      const timer = setInterval(() => {
        seconds--;
        document.getElementById("countdown").textContent = seconds;

        if (seconds <= 0) {
          clearInterval(timer);
          window.location.replace("https://elhaj.uk/");
        }
      }, 1000);
    }
  </script>
</body>
</html>
